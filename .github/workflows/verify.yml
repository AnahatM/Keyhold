# SPDX-License-Identifier: GPL-3.0-or-later
#
# The gate. Everything that must be true before a change lands on main.
#
# Actions are pinned to a full commit SHA, not a tag. A tag is a mutable pointer that the
# action's owner can move; for a password manager, "the CI that builds our binaries runs
# whatever that repo points v7 at today" is not an acceptable supply-chain position. The
# `# vX.Y.Z` comments are what Dependabot reads to bump these safely.

name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository, publish a package,
# or mint an id-token; anything that does must widen this at the job level and say why.
permissions:
  contents: read

# A superseded run on the same branch is wasted money on a private repo, where Actions
# minutes are metered.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review on pull requests, which needs the dependency graph GitHub only
  # provides free on a public repository — which is why this could not exist until now.
  #
  # It is the companion to audit.yml's weekly `npm audit`: that one asks "is anything we
  # already depend on known-bad this week", and this one asks "does this pull request add
  # something known-bad", which is the cheaper question to answer and the better moment to
  # answer it. Keyhold's dependency list is closed at six runtime packages, so a pull
  # request that adds one at all is worth a second look on its own.
  dependencies:
    name: Dependency review
    # Pull requests only. The action compares the base and head of a PR; on a push there is
    # no pair to compare and it fails rather than no-opping.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action reads the dependency graph for the two commits it compares.
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the dependency change
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `moderate`, matching audit.yml's runtime threshold and for the same reason: the
          # blast radius is a password manager.
          fail-on-severity: moderate
          # GPL-3.0-or-later can take any GPL-compatible dependency, so the licence check is
          # about noticing a surprise rather than blocking a category. These four are the
          # ones that would actually be incompatible with distributing Keyhold.
          deny-licenses: AGPL-3.0, SSPL-1.0, BUSL-1.1, Elastic-2.0

  verify:
    name: Gate (${{ matrix.os }})
    # Windows and macOS, since the repository went public.
    #
    # It was Windows-only for as long as the repository was private, because GitHub bills
    # Actions minutes on a private repo with a platform multiplier — Linux 1x, Windows 2x,
    # macOS 10x — and a macOS job in the gate would have burned the free allowance in a few
    # dozen pull requests, against decision D11's promise that this project costs nothing to
    # run. Standard runners are free on a public repository, so the gap closed with it.
    #
    # **It was a real gap and it was hiding real bugs.** The first macOS run this project
    # ever did found three: a Windows path built with the host's separator, and two test
    # fixtures that only parsed on Windows — one of them guarding the rule that no directory
    # path ever reaches a recovery report. Every one of them had been green on Windows for
    # months.
    #
    # Linux is not built or shipped at all (backlog F1), so it is absent for a different
    # reason than macOS, and `test:smoke` would need `xvfb-run` there.
    strategy:
      # A macOS failure must not hide a Windows one, or the other way round. Each platform's
      # result is worth having on its own.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # An Electron window that never reports back would otherwise sit here until GitHub's
    # 6-hour ceiling, metered at 2x the whole way.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow talks to git after the checkout, so leaving a
          # credential in .git/config would be handing a token to every npm lifecycle
          # script that runs afterwards.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `engines.node` in package.json is the floor (>=22). CI deliberately pins one
          # line rather than tracking that range, so an upstream Node release cannot turn
          # a green branch red overnight. Raise both together.
          node-version: 22
          # Keyed on package-lock.json by the action itself; a lockfile change invalidates
          # it, nothing else does.
          cache: npm

      - name: Install
        # `npm ci` — not `npm install`. It installs exactly the lockfile and fails if
        # package.json and package-lock.json disagree, which is the only install mode
        # worth having in CI for a project where a swapped dependency is a supply-chain
        # compromise.
        run: npm ci

      - name: Verify
        # One step, on purpose. `verify:full` is the project's own gate — formatting, lint,
        # typecheck, build, unit tests, then the launch smoke test — defined once in
        # package.json. Expanding it into five workflow steps would create a second copy of
        # the gate that drifts the first time someone adds a check to package.json and
        # forgets this file.
        #
        # Formatting used to be its own step here, outside `verify:full`. That meant a clean
        # local gate could still fail CI on whitespace, which is exactly what happened: a new
        # file passed lint, typecheck, tests, build and smoke, and CI rejected it for
        # formatting alone. The gate now contains everything CI enforces, so "green here"
        # means "green there" — which is the only property that makes a local gate worth
        # running.
        #
        # The smoke test is the tail of that chain, and it launches a real Electron
        # window. That works on GitHub's Windows runners without a virtual display: the
        # runner has an interactive desktop session, and Chromium falls back to software
        # rendering when no GPU is present. It is NOT skipped, conditioned, or allowed to
        # fail — a smoke test that CI skips is a smoke test that does not exist.
        #
        # (For reference, if a Linux job is ever added: there it genuinely needs
        # `xvfb-run --auto-servernum npm run test:smoke`, because ubuntu runners have no
        # display server at all. Windows and macOS runners do.)
        env:
          # Chromium's own logging, so that if the window does fail to come up on a runner
          # the log says why instead of just "timed out".
          ELECTRON_ENABLE_LOGGING: '1'
        run: npm run verify:full
